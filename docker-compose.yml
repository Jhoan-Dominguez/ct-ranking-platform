name: ct-ranking

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ctranking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ctranking}
      POSTGRES_DB: ${POSTGRES_DB:-ctranking}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Crea la base de datos de Keycloak la primera vez que se inicializa el volumen.
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-ctranking}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-ctranking}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      # Se sustituyen dentro de docker/keycloak/ct-ranking-realm.json al importar.
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-ct-ranking-dev-secret}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-admin@ctranking.local}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-Admin123!}
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Servidor SMTP de desarrollo: atrapa todos los correos (de Keycloak y de la app) y los muestra
  # en http://localhost:8025 sin enviarlos realmente. En producción se usa un SMTP real (.env).
  mailpit:
    image: axllent/mailpit:v1.31.3
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  pgdata:
